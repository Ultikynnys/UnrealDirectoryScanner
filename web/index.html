<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unreal Directory Scanner</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__lead">
        <h1 class="bar__title">Unreal Directory Scanner</h1>
        <p class="bar__root" id="root" title="scanned directory">no folder selected</p>
      </div>
      <div class="bar__tools">
        <input
          id="filter"
          class="input"
          type="search"
          placeholder="filter names"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn" id="expand" type="button">Expand all</button>
        <button class="btn" id="collapse" type="button">Collapse all</button>
        <label class="toggle" title="also list non-asset files (scripts, images, configs)">
          <input type="checkbox" id="showFiles" /> all files
        </label>
        <label class="toggle" title="check the Allar UE style guide directory rules">
          <input type="checkbox" id="lint" /> Allar checks
        </label>
        <label class="toggle" title="hide rows that have no issues">
          <input type="checkbox" id="issuesOnly" /> issues only
        </label>
        <button class="btn" id="pick" type="button">Choose folder&hellip;</button>
        <button class="btn btn--accent" id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <p class="stats" id="stats"></p>

    <p class="summary" id="summary" hidden></p>

    <p class="legend" id="legend" hidden></p>

    <p class="banner" id="error" hidden></p>

    <main class="wrap">
      <ul class="tree" id="tree"></ul>
      <p class="loading" id="loading">scanning&hellip;</p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
