<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unreal Directory Scanner</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar__lead">
        <h1 class="bar__title">Unreal Directory Scanner</h1>
        <p class="bar__root" id="root" title="scanned directory">no folder selected</p>
      </div>
      <div class="bar__tools">
        <input
          id="filter"
          class="input"
          type="search"
          placeholder="filter names"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn" id="expand" type="button">Expand all</button>
        <button class="btn" id="collapse" type="button">Collapse all</button>
        <label class="toggle" title="also list non-asset files (scripts, images, configs)">
          <input type="checkbox" id="showFiles" /> all files
        </label>
        <label class="toggle" title="asset naming: a recognised prefix, a PascalCase base name, two-digit variants">
          naming
          <select class="btn select" id="namingRules">
            <option value="off">off</option>
            <option value="all" selected>all</option>
            <option value="1.1">1.1 base name</option>
            <option value="00.1">00.1 characters</option>
          </select>
        </label>
        <label class="toggle" title="content directory structure: folder names, type folders, map and material placement">
          structure
          <select class="btn select" id="structureRules">
            <option value="off">off</option>
            <option value="all" selected>all</option>
            <option value="2.1.1">2.1.1 folder case</option>
            <option value="2.1.2">2.1.2 folder spaces</option>
            <option value="2.1.3">2.1.3 folder characters</option>
            <option value="2.2.1">2.2.1 global asset</option>
            <option value="2.4">2.4 map placement</option>
            <option value="2.6.1">2.6.1 Assets folder</option>
            <option value="2.6.2">2.6.2 type folder</option>
            <option value="2.8">2.8 base material</option>
            <option value="2.9">2.9 empty folder</option>
          </select>
        </label>
        <label class="toggle" title="hide rows that have no issues">
          <input type="checkbox" id="issuesOnly" /> issues only
        </label>
        <label class="toggle" title="switch between the light and dark themes">
          <input type="checkbox" id="darkMode" /> dark
        </label>
        <button class="btn" id="pick" type="button">Choose folder&hellip;</button>
        <button class="btn btn--accent" id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <p class="stats" id="stats"></p>

    <div class="summaries" id="summary" hidden></div>

    <p class="banner" id="error" hidden></p>

    <main class="wrap">
      <div class="pane">
        <ul class="tree" id="tree"></ul>
        <p class="loading" id="loading">scanning&hellip;</p>
      </div>

      <aside class="legend" id="legend" hidden></aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
