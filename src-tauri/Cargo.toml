[package]
name = "unreal-directory-scanner"
version = "0.6.2"
description = "Scan any directory and explore its Unreal asset tree"
authors = ["Ultikynnys"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
